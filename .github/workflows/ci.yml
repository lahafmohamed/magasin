name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Pin to the production PostgreSQL major (keep in sync with the deployed
        # server — see ecosystem.config.js / ops docs). CI parity guard.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magasin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: magasin_ci
      JWT_SECRET: ci-only-placeholder-secret-at-least-32-characters-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Surface known-vulnerable dependencies. Non-blocking: a fresh upstream
      # advisory should not wall off unrelated merges — dependabot opens the fix
      # PRs. Review the audit output in the run log.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Set up database (baseline + ref data + admin user + migration baseline)
        run: node scripts/ci-db-setup.mjs
      # Exercise the provisioning path (deploy/provision-client.sh) on a second
      # fresh DB: the ADMIN_*/MAGASIN_* overrides otherwise only run on a real
      # client provision, where a typo would surface far too late.
      - name: Verify provisioning env overrides (fresh DB)
        env:
          DB_NAME: magasin_provision
          ADMIN_USERNAME: gerant
          ADMIN_PASSWORD: 'Provision-CI-Only-1!'
          ADMIN_EMAIL: gerant@ci.local
          ADMIN_FULLNAME: Gérant CI
          ADMIN_MUST_CHANGE_PASSWORD: 'true'
          MAGASIN_CODE: MAG-01
          MAGASIN_NAME: Magasin principal
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres magasin_provision
          node scripts/ci-db-setup.mjs
          psql -h localhost -U postgres -d magasin_provision -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM utilisateurs u JOIN roles r ON r.id = u.role_id
             WHERE u.username = 'gerant' AND u.must_change_password AND r.nom = 'admin'" | grep -q 1
          psql -h localhost -U postgres -d magasin_provision -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM stock_locations WHERE code = 'MAG-01' AND est_principal" | grep -q 1
      - name: Test (integration, against service postgres)
        run: npm test
      - name: Build
        run: npm run build

  frontend:
    name: Frontend (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
